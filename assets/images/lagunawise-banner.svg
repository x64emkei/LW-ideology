<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061638" />
      <stop offset="45%" stop-color="#0B2252" />
      <stop offset="100%" stop-color="#1557A6" />
    </linearGradient>
    <radialGradient id="bannerGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2799E8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#061638" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bannerBg)" />
  <rect width="1200" height="320" fill="url(#bannerGlow)" />
  
  <!-- Subtle geometric grid lines -->
  <g stroke="#2799E8" stroke-width="1" opacity="0.12">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
  </g>

  <!-- Left Content -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="220" height="26" rx="4" fill="#1557A6" opacity="0.8" />
    <text x="110" y="17" fill="#DCEEFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="bold" font-size="11" letter-spacing="2" text-anchor="middle">LAGUNAWISE DIVISION</text>
    <text x="0" y="70" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">IDEOLOGY DIVISION</text>
    <text x="0" y="105" fill="#DCEEFF" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="17">Understanding Ideas. Challenging Perspectives. Empowering Minds.</text>
    
    <g transform="translate(0, 145)" fill="#C5CEDB" font-family="'Inter', system-ui, sans-serif" font-size="13">
      <text x="0" y="0">📍 Barangay Barandal, Calamba City, Laguna</text>
      <text x="360" y="0">✉️ lagunawise.ph@gmail.com</text>
      <text x="640" y="0">🌐 Digital Citizenship &amp; Media Literacy</text>
    </g>
  </g>

  <!-- Circular Design Emblem right side -->
  <g transform="translate(1050, 160)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#2799E8" stroke-width="2" opacity="0.3" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="80" fill="#0B2252" stroke="#2799E8" stroke-width="3" />
    <path d="M 0 -45 L 35 -15 L 20 40 L -20 40 L -35 -15 Z" fill="#1557A6" stroke="#DCEEFF" stroke-width="2" />
    <circle cx="0" cy="0" r="18" fill="#2799E8" />
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
  </g>
</svg>
